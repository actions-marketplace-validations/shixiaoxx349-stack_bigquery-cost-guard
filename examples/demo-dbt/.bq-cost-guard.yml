version: 1

dbt:
  project_dir: "."
  profiles_dir: "."

bigquery:
  # Personal (non-work) GCP project that runs the dry-run jobs.
  project_id: "bq-cost-guard-dev"
  location: US

# Tuned so the healthy model (~a few GiB/day) stays ✅ while the regression
# (full year + SELECT *, ~2 TiB) is ❌ on both absolute size and % increase.
thresholds:
  warn_bytes: 53687091200       # 50 GiB
  fail_bytes: 107374182400      # 100 GiB
  warn_increase_percent: 50
  fail_increase_percent: 200

analysis:
  detect_select_star: true
  detect_missing_partition_filter: true

pricing:
  price_per_tib_usd: 6.25       # shows the estimated $ line in the comment
